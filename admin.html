<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة الإدارة · CODE TO MOTION</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f3ff,#10052f);--bg2:light-dark(#fff,#1a0b47);--ink:light-dark(#170a3a,#f4f0ff);--mute:light-dark(#5b5280,#c9bff0);--line:light-dark(#e2dbfb,#33236e);--pink:#ff2e9a;--vio:#7b2cff;--ok:#00a37a;--bad:#e5484d}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Cairo,Tahoma,sans-serif}
button,input{font:inherit}
.top{display:flex;align-items:center;gap:14px;padding:12px max(4vw,16px);background:#14063f;color:#fff;flex-wrap:wrap}
.top img{width:40px;height:40px;border-radius:10px}.top b{font-size:18px}
.top .me{margin-inline-start:auto;font-size:14px;opacity:.85}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(20px,4vw,40px) max(4vw,16px)}
h1{font-size:clamp(26px,3vw,36px);margin:0 0 6px}
.mute{color:var(--mute)}
.btn{min-height:46px;padding:8px 20px;border-radius:999px;border:0;font-weight:900;cursor:pointer;background:var(--bg2);color:var(--ink);border:1.5px solid var(--line)}
.btn.p{background:linear-gradient(90deg,var(--vio),var(--pink));color:#fff;border:0}
.btn.ok{background:var(--ok);color:#fff;border:0}.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--bg2);border:1.5px solid var(--line);border-radius:22px;padding:22px}
.login{max-width:440px;margin:8vh auto}
input.f{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;margin:6px 0 14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.tabs button{min-height:46px;padding:8px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);color:var(--ink);font-weight:900;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tabs small{opacity:.7;margin-inline-start:4px}
.seg{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.seg button{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--pink);border-color:var(--pink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.work{background:var(--bg2);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.work video,.work .ph{width:100%;aspect-ratio:16/9;background:#14063f;display:grid;place-items:center;color:#fff}
.work .in{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.work h3{margin:0;font-size:18px}
.badge{align-self:flex-start;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--line)}
.badge.approved{background:#00a37a33;color:var(--ok)}.badge.rejected{background:#e5484d22;color:var(--bad)}.badge.pending{background:#ffd84d44}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
table{width:100%;border-collapse:collapse;background:var(--bg2);border-radius:16px;overflow:hidden}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:start}
td.mono{font-family:Consolas,monospace;direction:ltr;text-align:end}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.empty{padding:40px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:20px}
.form{display:grid;gap:4px;max-width:520px}
.msg{min-height:24px;font-weight:700;color:var(--pink)}
a{color:var(--pink)}
@media(max-width:600px){th:nth-child(3),td:nth-child(3){display:none}}
</style>
</head>
<body>
<header class="top"><img src="logo.png" alt=""><b>لوحة الإدارة</b><span class="me" id="me"></span><button class="btn sm" id="out" hidden>تسجيل خروج</button></header>

<main class="wrap">
  <section id="login" class="login card" hidden>
    <h1>تسجيل الدخول</h1>
    <p class="mute">اكتب إيميل المشرف، ويوصلك رابط دخول. بدون كلمة مرور.</p>
    <form id="loginForm"><input class="f" id="email" type="email" required dir="ltr" placeholder="you@email.com" autocomplete="email"><button class="btn p" style="width:100%" type="submit">أرسل رابط الدخول</button></form>
    <p class="msg" id="loginMsg" role="status"></p>
  </section>

  <section id="denied" class="login card" hidden>
    <h1>ما عندك صلاحية</h1>
    <p class="mute">هذا الإيميل مو مسجّل كمشرف.</p>
  </section>

  <section id="panel" hidden>
    <h1>أهلًا عبدالرحمن 👋</h1>
    <p class="mute">كل اللي هنا تشوفه أنت بس.</p>
    <div class="tabs" id="tabs">
      <button type="button" data-tab="works" aria-pressed="true">الأعمال<small id="cPending"></small></button>
      <button type="button" data-tab="subs" aria-pressed="false">المشتركين<small id="cSubs"></small></button>
      <button type="button" data-tab="next" aria-pressed="false">الورشة الجاية</button>
    </div>

    <div data-panel="works">
      <div class="seg" id="seg">
        <button type="button" data-status="pending" aria-pressed="true">تنتظر المراجعة</button>
        <button type="button" data-status="approved" aria-pressed="false">معتمدة</button>
        <button type="button" data-status="rejected" aria-pressed="false">مرفوضة</button>
      </div>
      <div class="grid" id="works"></div>
    </div>

    <div data-panel="subs" hidden>
      <div class="bar"><b id="subsCount"></b><button class="btn sm" id="copyEmails" type="button">انسخ الإيميلات</button><button class="btn sm" id="csv" type="button">تصدير CSV</button></div>
      <div id="subs"></div>
    </div>

    <div data-panel="next" hidden>
      <form class="form card" id="nextForm">
        <label>عنوان الورشة<input class="f" id="nTitle" maxlength="80"></label>
        <label>الموعد (بتوقيت جهازك)<input class="f" id="nDate" type="datetime-local"></label>
        <label>رابط التسجيل<input class="f" id="nLink" type="url" dir="ltr" placeholder="https://lu.ma/..."></label>
        <div class="bar"><button class="btn p" type="submit">احفظ</button><button class="btn" type="button" id="nClear">امسح الموعد (يطلع «قريبًا»)</button></div>
        <p class="msg" id="nMsg" role="status"></p>
      </form>
    </div>
  </section>
</main>

<script src="vendor/supabase-2.119.0.js"></script>
<script src="backend.js"></script>
<script src="admin.js"></script>
</body>
</html>
