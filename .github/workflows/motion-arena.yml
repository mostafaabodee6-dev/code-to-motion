name: Motion Arena checks
on:
  push:
    branches: [motion-arena]
    paths:
      - 'arena/**'
      - '.github/workflows/motion-arena.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify JavaScript and renderer
        run: |
          for file in arena/*.mjs; do node --check "$file"; done
          node --test arena/tests/motion.test.mjs
      - name: Install browser test runtime
        run: |
          npm install --prefix arena --no-save playwright@1.65.1
          npx --prefix arena playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
          ffprobe -version
      - name: Verify editor, storage and video files
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..15}; do
            if curl -fsS http://127.0.0.1:8766/arena/ >/dev/null; then break; fi
            sleep 1
          done
          node arena/tests/e2e.mjs
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: arena_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify moderation, permissions and voting
        run: |
          psql -v ON_ERROR_STOP=1 \
            -f arena/tests/database-fixture.sql \
            -f arena/supabase/001_motion_arena.sql \
            -f arena/tests/database.test.sql
